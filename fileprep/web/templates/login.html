{% extends "base.html" %}
{% block title %}Sign in · File Prepare HF{% endblock %}
{% block body %}
<div class="auth-page">
    <form class="panel auth-card" method="post" action="{{ base }}/login" autocomplete="on">
        <h1>File Prepare HF</h1>
        <p class="muted small">Version {{ version }} · sign in to continue</p>
        {% if error %}
        <div class="alert error">{{ error }}</div>
        {% endif %}
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <div class="field"><span class="label">Username</span><input type="text" name="username" autocomplete="username" required autofocus></div>
        <div class="field"><span class="label">Password</span><input type="password" name="password" autocomplete="current-password" required></div>
        <button class="primary" type="submit" style="width:100%">Sign in</button>
    </form>
</div>
{% endblock %}
